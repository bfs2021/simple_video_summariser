# The version pinned in requirements.backend.txt is yt-dlp 2026.08.19. Every case
# names the yt-dlp version it came from and how it was obtained:
#   live run  - captured on the dev machine; watch URLs passed in full
#   issue log - copied verbatim from a yt-dlp GitHub issue, for failures that
#               cannot be provoked from here (geoblock, bot check, 403 on
#               video data, broken extractor)
#   SOURCE    - assembled from the yt-dlp source at the stated version, for the
#               current wording of a line whose only captured log is older
# Do not paraphrase. Add new cases the same way when yt-dlp output changes.

