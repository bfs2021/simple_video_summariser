[[case]]
# yt-dlp 2026.08.19 SOURCE, not a live run: a download-side EDQUOT, following the
# existing live "[Errno 28] No space left on device" case further down this file.
# Python's OSError string for EDQUOT is "Disk quota exceeded" (errno.py), which
# yt-dlp prints the same way it prints ENOSPC (from #19 QA, folded into #69)
stderr = '''
ERROR: [Errno 122] Disk quota exceeded
'''
returncode = 1
error_class = "RESOURCE"

