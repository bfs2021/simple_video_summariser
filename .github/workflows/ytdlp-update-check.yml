# Daily yt-dlp staleness check (issue #68, architecture.md 16.11).
#
# Reports through a red run with an ::error annotation naming the pinned and
# the latest version. It never edits the pin and nothing depends on it, so it
# cannot block a deploy; a PyPI outage ends green and retries tomorrow.
# CI proper lives in ci.yml (#61).
name: yt-dlp update check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ytdlp-update-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare the pinned yt-dlp with PyPI
        run: python3 scripts/ytdlp_update_check.py requirements.backend.txt
