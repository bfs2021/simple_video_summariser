[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdigest"
version = "0.1.0"
description = "Structured, queryable summaries of YouTube videos and channels."
requires-python = ">=3.14,<3.15"
readme = "README.md"

[project.scripts]
ytdigest = "services.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    # One-Postgres-container-per-session fixture for integration tests
    # (architecture.md 13; task #7).
    "testcontainers[postgres]==4.15.0",
    # Required by FastAPI's TestClient (task #39).
    "httpx==0.28.1",
]

[tool.setuptools.package-data]
"adapters.summarize" = ["prompts/*/*.txt"]
"services.api" = ["templates/*.html"]

[tool.setuptools.packages.find]
include = ["common*", "adapters*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration: needs a real Postgres (Docker Desktop running); deselect with -m \"not integration\"",
    "whisper: needs faster-whisper installed (pip install -r requirements.whisper.txt); deselected by default, select with -m whisper",
    "image: builds the backend, whisper and frontend container images (minutes, downloads from PyPI, Debian and the npm registry); needs Docker Desktop; deselected by default, select with -m image",
]

[tool.ruff]
extend-exclude = ["web", "_docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "TID251"]

# Only common/config.py reads environment variables (architecture.md 10).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read settings via common.config.get_settings()"
"os.getenv".msg = "Read settings via common.config.get_settings()"
"os.environb".msg = "Read settings via common.config.get_settings()"
"os.getenvb".msg = "Read settings via common.config.get_settings()"
"os.putenv".msg = "Read settings via common.config.get_settings()"
"os.unsetenv".msg = "Read settings via common.config.get_settings()"

[tool.ruff.lint.per-file-ignores]
"common/config.py" = ["TID251"]

[tool.mypy]
strict = true
exclude = [
    '^\.venv/',
    '^web/',
    '^_docs/',
]
