# DEVELOPMENT ONLY. `docker compose` merges this file into compose.yml
# automatically on a developer machine (architecture.md 11.7; task #59).
# It is never used on the server: deployment runs
# `docker compose -f compose.yml up -d` explicitly, which skips this file, so
# nothing below can reach production. compose.yml does not reference it.
#
# What it does, per service:
#   - api, planner, analyzer, transcriber: bind-mount ./common, ./adapters and
#     ./services read-only over the copies baked into the image, so a code
#     edit needs no rebuild. Read-only because the containers run as uid
#     10001 (#55): a writable mount would let Python drop `__pycache__` files
#     owned by 10001 into the WSL tree, where the developer cannot delete
#     them. Compose merges `volumes` by mount target, so these ADD to the
#     `audio` and `whisper-models` mounts from compose.yml.
#   - api: `uvicorn --reload`, watching only the mounted source directories
#     (uvicorn's own stat reloader; no extra package).
#   - planner, analyzer, transcriber keep their compose.yml commands (no
#     wrapper process, no shell) and restart on a source edit through Docker
#     Compose Watch (`develop.watch`, `action: restart`; #142). Mechanism
#     choice: Compose Watch is built into `docker compose`, so it adds no
#     dependency, matching #59's no-extra-reloader-package decision (the
#     file-watcher CLI option was rejected for that reason). `action: sync`
#     is not used: the source mounts are read-only. Dev loop, either of:
#       docker compose up -d --build   then, in its own terminal,
#       docker compose watch --no-up
#     or, in the foreground, `docker compose up --watch --build`. `-d` and
#     `--watch` cannot be combined (Compose rejects it). Without watch,
#     nothing restarts by itself and `docker compose restart <service>`
#     still picks up an edit. `api` has no watch rule: uvicorn reloads it,
#     and watching it too would restart it twice.
#     Watch paths per worker: ./common, ./adapters and ONLY its own
#     ./services/<worker> (never all of ./services, or an edit to
#     services/api would restart the transcriber mid-job). Rule: if a worker
#     starts importing another service package (for example services.planner
#     importing services.analyzer), add that path to its watch list here.
#     `**/__pycache__/**` and `**/*.pyc` are ignored, or host-side pytest and
#     mypy would restart every worker.
#     A job in flight when its worker restarts: the worker (SIGTERM) stops
#     claiming and gives the handler WORKER_SHUTDOWN_GRACE_SEC (default 20 s)
#     to finish, then sets ctx.cancelled. A handler that reaches
#     check_cancelled() hands the job back without spending an attempt (#13);
#     for `transcribe` the transcription starts again from the beginning on
#     the next claim and the progress so far is lost. A handler still blocked
#     past the 30 s stop_grace_period is SIGKILLed and the reaper recovers
#     the job (#12). So do not edit worker code during a long dev
#     transcription you want to keep; run plain `up -d` (no watch) instead.
#   - migrate: bind-mounts ./migrations read-only so a new revision runs with
#     `docker compose run --rm migrate` and no rebuild. Still only on demand.
#   - web: the Vite dev server (HMR) from node:24-alpine instead of nginx, on
#     127.0.0.1:5173. The compose.yml `build:` is removed (`!reset`) so
#     `docker compose build` cannot build the nginx image and tag it
#     node:24-alpine, and the 8080 publish is replaced (`!override`).
#   - transcriber: WHISPER_MODEL defaults to `tiny` (not `tiny.en`: episodes
#     can be non-English) so local iteration does not take hours.
#   - db: published on 127.0.0.1:5432 for `psql` and the host venv's `alembic`.
#
# `db` lives on `internal` only in compose.yml (architecture.md 11.4 -
# "no route off the compose bridge except through explicitly attached
# networks"), and Docker never forwards a published port for a container
# whose only network is `internal: true`, no matter what the port mapping
# says. A fixed 127.0.0.1 publish on such a container is unreachable from
# the host on any machine (QA on #7). So, dev-only: attach `db` to a
# second, ordinary bridge network (`devhost`, defined below) alongside
# `internal`, purely so the published port has a non-internal network to
# forward through. `docker compose -f compose.yml config` - the production
# path - never sees this network or the port publish.
#
# No secrets and no keys here. The only new environment values are
# WHISPER_MODEL on `transcriber` and API_PROXY_TARGET on `web`.

services:
  db:
    networks: [internal, devhost]
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    volumes:
      - ./migrations:/app/migrations:ro

  api:
    # Replaces the compose.yml command (a string is replaced, not merged).
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/common --reload-dir /app/adapters --reload-dir /app/services
    volumes:
      - ./common:/app/common:ro
      - ./adapters:/app/adapters:ro
      - ./services:/app/services:ro

  planner:
    volumes:
      - ./common:/app/common:ro
      - ./adapters:/app/adapters:ro
      - ./services:/app/services:ro
    develop:
      watch:
        - {action: restart, path: ./common, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./adapters, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./services/planner, ignore: ["**/__pycache__/**", "**/*.pyc"]}

  analyzer:
    volumes:
      - ./common:/app/common:ro
      - ./adapters:/app/adapters:ro
      - ./services:/app/services:ro
    develop:
      watch:
        - {action: restart, path: ./common, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./adapters, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./services/analyzer, ignore: ["**/__pycache__/**", "**/*.pyc"]}

  transcriber:
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
    volumes:
      - ./common:/app/common:ro
      - ./adapters:/app/adapters:ro
      - ./services:/app/services:ro
    develop:
      watch:
        - {action: restart, path: ./common, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./adapters, ignore: ["**/__pycache__/**", "**/*.pyc"]}
        - {action: restart, path: ./services/transcriber, ignore: ["**/__pycache__/**", "**/*.pyc"]}

  web:
    build: !reset null
    image: node:24-alpine
    # Layout (the #59 QA failure): ./web is NOT bind-mounted as a whole, and no
    # volume is mounted inside a bind source. A volume at ./web/node_modules
    # makes the daemon create that mountpoint in the host tree as root on a
    # fresh checkout, which needs sudo to delete. Instead only the source
    # files are bound, read-only, into /home/node/app, and node_modules is
    # created there in the container's own layer, never in the WSL tree. A
    # new top-level file that Vite or tsc needs must be added to this list.
    # `:ro` also means nothing the container does can leave a file in ./web.
    # Starts as root only to hand /home/node/app (root-created as the
    # working_dir) to `node` (uid 1000), then drops to `node` for npm, which
    # also keeps musl-built packages apart from the host's glibc ones.
    # `--strictPort` fails instead of moving to another port.
    command:
      - sh
      - -c
      - >-
        chown node:node /home/node/app &&
        exec su node -c 'npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort'
    working_dir: /home/node/app
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web/src:/home/node/app/src:ro
      - ./web/index.html:/home/node/app/index.html:ro
      - ./web/index.css:/home/node/app/index.css:ro
      - ./web/package.json:/home/node/app/package.json:ro
      - ./web/package-lock.json:/home/node/app/package-lock.json:ro
      - ./web/tsconfig.json:/home/node/app/tsconfig.json:ro
      - ./web/vite.config.ts:/home/node/app/vite.config.ts:ro

networks:
  devhost: {}
