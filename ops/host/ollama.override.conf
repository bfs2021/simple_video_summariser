# ytdigest — Ollama systemd drop-in (task #78)
#
# The analyzer container reaches the host's Ollama at
# http://host.docker.internal:11434 (compose.yml: extra_hosts
# "host.docker.internal:host-gateway"). On Linux, Ollama listens on
# 127.0.0.1:11434 by default, which a container cannot reach through
# host-gateway. This drop-in binds Ollama to the Docker bridge gateway
# (docker0, default 172.17.0.1) so containers can reach it, without exposing
# it on any external interface.
#
# Install (needs sudo):
#   sudo install -D -m 644 ops/host/ollama.override.conf \
#     /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Trade-off (see _docs/deploy-host.md → Ollama): binding to 172.17.0.1 keeps
# Ollama off every external interface, but it is no longer on 127.0.0.1, so
# host-local clients must point at it explicitly, e.g.
#   OLLAMA_HOST=172.17.0.1:11434 ollama pull qwen3.5:4b
# Ordering (After/Wants=docker.service) ensures the docker0 bridge exists
# before Ollama binds to its gateway address.

[Unit]
After=docker.service
Wants=docker.service

[Service]
Environment="OLLAMA_HOST=172.17.0.1:11434"
